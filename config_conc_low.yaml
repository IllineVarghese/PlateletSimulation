simulation:
  seed: 42
  num_agents: 500
  dt: 0.001
  steps: 2000
  device: gpu

geometry:
  type: cylinder
  radius: 1.0
  length: 10.0

flow:
  type: poiseuille
  max_velocity: 1.0

output:
  base_dir: results/conc/low
  save_every: 10

activation:
  near_wall_dist_frac: 0.10
  activation_rate: 0.5
  decay_rate: 0.5

adhesion:
  enabled: true
  act_threshold: 0.02
  stick_factor: 0.2

wall:
  restitution: 0.0